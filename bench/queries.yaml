# The search benchmark (`python -m mdept.bench`): a query in a consumer's words, and the
# entries it should find in the top five. Keys: q, expected (IDs; empty only for a
# no-answer row), form (math-words, engineering-words, latex, candidate-title,
# restatement, no-answer), held_out (true for a row written by a context that never saw
# the entry; absent means the mined split), source and note (free text).
#
# These rows are the mined split: each was written from the request its entry came in
# with, in other words than the entry's title. It measures how well the search finds a
# statement from the words it was filed in, and `--check` holds its recall@5 to
# `MINED_RECALL_FLOOR` in `mdept/bench.py`. A held-out row is written by a context that
# reads only the consumers' documents.
# Abstract mathematics only: this file is public.
