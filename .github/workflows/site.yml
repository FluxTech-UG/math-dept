name: site

# Validates the ledger (`python -m mdept.check`), then builds the reading site from it
# (`python -m mdept.site`) and publishes it to GitHub Pages. The build reads the entry
# files, site.toml and the committed figures/; neither step runs Lean or a counterexample
# script, so both need only the package itself.
# Pages must be set to "GitHub Actions" as its source in the repo settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A queued run waits for the running deploy rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A version within pyproject.toml's requires-python.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - run: python -m mdept.check

      - run: python -m mdept.site --repo . --out build/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
